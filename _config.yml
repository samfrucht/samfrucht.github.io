# =============================================================================
#  SITE SETTINGS — this is the main file you'll edit.
#  After saving, GitHub rebuilds the site automatically (takes ~1 minute).
#  Tip: lines starting with "#" are comments and are ignored.
# =============================================================================

title: Samantha Frucht
description: >-
  PhD candidate at UC Irvine studying compound natural hazards and their
  societal impacts.
url: "https://samfrucht.github.io"   # change if you add a custom domain later
baseurl: ""
lang: en

# --- About you (shown in the sidebar) ----------------------------------------
author:
  name: Samantha Frucht
  pronouns: she/her                  # leave "" to hide
  role: PhD Candidate
  department: ""                     # leave "" to hide
  institution: University of California, Irvine
  location: ""                       # e.g. "Irvine, CA" — leave "" to hide
  avatar: /images/profile.jpg        # to change: upload a new photo to images/ and update this
  # How your name appears in author lists — it gets bolded on the
  # Publications and Presentations pages. Add every variant you use.
  pub_names:
    - "Frucht, S."
    - "S. Frucht"
    - "Samantha Frucht"

# --- Links (icons in the sidebar). Leave a value "" to hide that link. -------
# Email is split in two so spam bots can't read it from the page; the full
# address is assembled in the visitor's browser.
links:
  email_user: sfrucht
  email_domain: uci.edu
  github: samfrucht                                  # username only
  bluesky: samfrucht.bsky.social                     # handle without "@"
  linkedin: samanthafrucht                           # the part after /in/
  orcid: 0000-0002-2468-3956
  google_scholar: wZxHqg8AAAAJ                       # the "user=" value

# --- CV (Vita page) --------------------------------------------------------------------
# Export your CV from Overleaf as PDF, name it cv.pdf and upload it to
# assets/files/ (replacing the old one). The download button finds it there.
cv_pdf: /assets/files/cv.pdf
cv_updated: "November 2026"          # shown on the Vita page

# --- Job market banner on the home page (set to "" to hide) ------------------
job_market: "I am looking for postdoctoral and research opportunities beginning in Fall 2027, especially at the intersection of natural hazards and human health."
# example: "I am on the job market for postdoctoral positions starting in 2027."

# =============================================================================
#  Technical settings — you shouldn't need to touch anything below here.
# =============================================================================
theme: null          # no theme — this site uses its own design
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
