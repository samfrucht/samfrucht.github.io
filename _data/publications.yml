# =============================================================================
#  PUBLICATIONS
#  Each block starting with "- title:" is one paper. Copy a block to add one.
#  Fields you don't have can be left out entirely (e.g. no "code:" line).
#
#  status:  published | accepted | in-review | in-prep
#           published & accepted both appear under "Peer-reviewed publications";
#           accepted papers get an "In press" tag.
#  doi:     just the DOI, e.g. 10.1029/2024GL000000  -> becomes a DOI button
#  pdf:     a link, or a file you upload to assets/files/ (e.g. /assets/files/frucht2026jgr.pdf)
#  preprint: link to a preprint (e.g. ESS Open Archive) -> "Preprint" button
#  code / data / link: any URL -> become buttons
#  bibtex:  paste a BibTeX entry after "bibtex: |" (indented) -> "Cite" button
#  Your name is bolded automatically (see pub_names in _config.yml).
# =============================================================================

- title: "[PLACEHOLDER] Title of your JGR: Atmospheres paper"
  authors: "Frucht, S., [Coauthors], & Baldwin, J. E."
  journal: "Journal of Geophysical Research: Atmospheres"
  year: 2026
  status: accepted
  doi: "10.1029/2026JD047940"
  pdf: ""                         # e.g. /assets/files/frucht2026jgr.pdf

- title: "[PLACEHOLDER] Title of your Earth's Future paper"
  authors: "[First Author], Frucht, S., [Coauthors]"
  journal: "Earth's Future"
  details: ""                     # volume(issue), article number
  year: 2025                      # [CHECK YEAR]
  status: published
  doi: "10.1029/2025EF007720"
  pdf: ""

- title: "[PLACEHOLDER] Title of your paper in review"
  authors: "[Authors — Frucht, S. is bolded automatically]"
  journal: "[Journal it was submitted to]"
  year: 2026
  status: in-review
  preprint: "https://doi.org/10.22541/essoar.15004387/v3"

