<header class="masthead">
  <div class="masthead__inner">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      {% include icon.html name="bars" %}
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.navigation %}
          {% assign item_url = item.url | relative_url %}
          {% assign page_url = page.url | relative_url %}
          <li><a href="{{ item_url }}"{% if page_url == item_url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle light / dark">
      <span class="theme-toggle__sun">{% include icon.html name="sun" %}</span>
      <span class="theme-toggle__moon">{% include icon.html name="moon" %}</span>
    </button>
  </div>
</header>
